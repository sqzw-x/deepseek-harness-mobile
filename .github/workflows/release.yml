name: Release APK

'on':
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # The legacy `tools` package is no longer published. Asking for it makes
          # current hosted runners fail before Gradle starts.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4

      # A fork without the signing secrets cannot produce a release, and should not look broken:
      # report why and let the run finish green. Everything after this is skipped in that case.
      - name: Restore required release signing keystore
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::notice::Release signing secret $name is not configured; skipping the release."
              echo "available=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          test -s "$RUNNER_TEMP/release.keystore"
          echo "available=true" >> "$GITHUB_OUTPUT"

      # The tag is the single source of the shipped version; see app/build.gradle.kts.
      - name: Derive version from tag
        if: steps.signing.outputs.available == 'true'
        run: echo "DSH_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Unit tests
        if: steps.signing.outputs.available == 'true'
        run: ./gradlew :core:test :mock-harness:test :app:testReleaseUnitTest --stacktrace

      - name: Build release APK
        if: steps.signing.outputs.available == 'true'
        env:
          DSH_KEYSTORE: ${{ runner.temp }}/release.keystore
          DSH_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          DSH_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          DSH_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Release lint
        if: steps.signing.outputs.available == 'true'
        run: ./gradlew :app:lintRelease --stacktrace

      - name: Verify release signature
        if: steps.signing.outputs.available == 'true'
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose "$APK"

      - name: Checksums
        if: steps.signing.outputs.available == 'true'
        run: |
          cd app/build/outputs/apk/release
          sha256sum *.apk > SHA256SUMS.txt
          ls -la

      - name: Publish GitHub Release
        if: steps.signing.outputs.available == 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          generate_release_notes: true
